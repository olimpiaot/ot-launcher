# Exemplo de configuração Nginx para a API do Launcher
# Salve este arquivo em: /etc/nginx/sites-available/ot-launcher-api
# Depois crie o link: sudo ln -s /etc/nginx/sites-available/ot-launcher-api /etc/nginx/sites-enabled/

# Configuração HTTP (redireciona para HTTPS se tiver SSL)
server {
    listen 80;
    server_name api.seudominio.com;  # SUBSTITUA pelo seu domínio

    # Redirecionar para HTTPS (descomente se tiver SSL)
    # return 301 https://$server_name$request_uri;

    # OU manter HTTP (se não tiver SSL)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

